name: Keep Streamlit awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: curl -fsS -m 30 -o /dev/null -w "HTTP %{http_code}\n" "https://food-delivery-data-pipeline-business-analytics.streamlit.app/"